[project]
name = "iso20022-mcp"
version = "0.0.18"
description = "Unified Model Context Protocol (MCP) gateway for ISO 20022: one small set of meta-tools (search, describe, validate, generate, parse) routing across the pain, pacs, camt and acmt message families."
authors = [
    { name = "Sebastien Rousseau", email = "sebastian.rousseau@gmail.com" },
]
license = "Apache-2.0 OR MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "iso-20022",
    "mcp",
    "payments",
    "pain001",
    "pacs008",
    "camt053",
    "acmt001",
    "fintech",
]
# Runtime dependencies stay in [tool.poetry.dependencies] below: the
# vendored tests/test_suite_conformance.py reads them from there for
# poetry-core builds, and its checksum forbids adapting it here.
dynamic = ["classifiers", "dependencies"]

# Install only the families you need, or `pip install iso20022-mcp[all]`.
# Each spec here must equal the one in [tool.poetry.dependencies];
# tests/test_extras_resolve.py fails if they drift apart.
[project.optional-dependencies]
pain = ["pain001-mcp>=0.0.74"]
pacs = ["pacs008-mcp>=0.0.15"]
camt = ["camt053-mcp>=0.0.23"]
acmt = ["acmt001-mcp>=0.0.13"]
all = [
    "pain001-mcp>=0.0.74",
    "pacs008-mcp>=0.0.15",
    "camt053-mcp>=0.0.23",
    "acmt001-mcp>=0.0.13",
]
# Framework adapters -- one extra per supported agent framework.
langchain = ["langchain-core>=0.2"]

[project.urls]
homepage = "https://iso20022-mcp.com"
repository = "https://github.com/sebastienrousseau/iso20022-mcp"

[project.scripts]
iso20022-mcp = "iso20022_mcp.server:main"

[tool.poetry]
packages = [
    { include = "iso20022_mcp" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# GHSA-84m7-p3x7-pcfv: unbounded StreamableHTTP session accumulation in
# mcp >=1.8.0,<1.30.0 and >=2.0.0,<2.2.0. The gateway serves streamable HTTP,
# so every affected release is unresolvable: an install on one is forced to
# move to 1.30.0+ on the 1.x line or 2.2.0+ on the 2.x line.
mcp = ">=1.30.0,!=2.0.*,!=2.1.*,<3"
# Backing family servers are optional: install only the families you need, or
# `pip install iso20022-mcp[all]` for everything. The gateway imports them
# lazily and returns an actionable error if a needed family is absent.
# The `<0.0.61` cap is gone. It was there because pain001 moved to xmlschema
# 4.x at 0.0.61 while camt053 and acmt001 were still on 3.x, so `[all]` could
# not be installed at all -- raising the floor without the cap is exactly what
# broke 0.0.6. The whole family is now on xmlschema >=4.3.2 (camt053 0.0.17,
# acmt001 0.0.5), so the floors move together and the cap is no longer load-
# bearing. `test_extras_resolve.py` asserts the four agree.
# The suite releases in lockstep, so each floor is the family release this
# gateway ships with: pain001-mcp 0.0.74, pacs008-mcp 0.0.15, camt053-mcp
# 0.0.23 and acmt001-mcp 0.0.13.
pain001-mcp = { version = ">=0.0.74", optional = true }
pacs008-mcp = { version = ">=0.0.15", optional = true }
camt053-mcp = { version = ">=0.0.23", optional = true }
acmt001-mcp = { version = ">=0.0.13", optional = true }
# Optional agent-framework adapters (see iso20022_mcp/adapters.py). These are
# heavy and conflict-prone, so they are strictly optional and are NOT test or
# runtime dependencies; the base install never imports them.
langchain-core = { version = ">=0.2", optional = true }

# Transitive, via `mcp` -> `pyjwt[crypto]`. Nothing in this tree
# constrains it, so a resolver is free to pick a version in the
# >=44.0.0,<50.0.0 range that GHSA flags as high severity. Floored
# here so the patched line is the only resolvable one; the pins in
# requirements/ already sit at 50.0.0.
cryptography = ">=50.0.0"
# Transitive, via `mcp` -> `httpx`: certifi < 2026.10.19 is affected by
# PYSEC-2026-4320, and poetry.lock held 2026.10.18.
certifi = ">=2026.10.19"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=6.0.0,<8.0.0"
black = "^26.3.1"
ruff = ">=0.1,<0.18"
mypy = ">=1.11,<3.0"
bandit = "^1.7.0"
# Property-based fuzzing of the tool surface (tests/test_fuzz.py).
hypothesis = ">=6.100"
# Used by tests/test_extras_resolve.py to parse the dependency constraints in
# this file. Both arrive transitively via pytest, but declared here because a
# test that silently stops running when a transitive drops out is worse than
# no test.
packaging = ">=23.0"
tomli = { version = ">=2.0", python = "<3.11" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# tests/test_suite_conformance.py is generated and vendored from one
# canonical copy shared across the suite, and checksummed by its own
# test. The suite uses three different line lengths, so letting each
# repository's formatter rewrite it would make the checksum
# unsatisfiable everywhere.
[tool.black]
extend-exclude = "tests/test_suite_conformance\\.py"
line-length = 79
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=iso20022_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["iso20022_mcp"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@overload",
]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.md", "tmp_env", ".venv", ".eggs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "tmp_env/",
    ".venv/",
    ".eggs/",
]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Backing family servers are dynamically imported optional dependencies; they
# may not be present when type-checking the gateway in isolation.
module = [
    "pain001_mcp.*",
    "pacs008_mcp.*",
    "camt053_mcp.*",
    "acmt001_mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Agent frameworks are optional extras, lazily imported by adapters.py and not
# present when type-checking the gateway in isolation.
module = [
    "langchain_core.*",
    "crewai.*",
    "crewai_tools.*",
    "llama_index.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The meta-tools return bare JSON-shaped data routed from dynamically-resolved
# backing callables. Relax the two strict checks that trips while keeping the
# rest of strict mode in force.
module = "iso20022_mcp.server"
disallow_any_generics = false
warn_return_any = false
# The server object comes from the SDK-compat shim, so its decorators are
# untyped from mypy's point of view on either major.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "return-value", "attr-defined", "assignment"]
