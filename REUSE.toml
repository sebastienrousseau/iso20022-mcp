# Licensing for files that cannot carry a comment header (generated
# lockfiles, JSON manifests, binary media, licence texts). Checked by
# `reuse lint`.
version = 1

[[annotations]]
path = [
  "poetry.lock",
  "requirements/*.txt",
  "glama.json",
  "server.json",
  "CITATION.cff",
  ".github/demo.gif",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023-2026 Sebastien Rousseau <sebastian.rousseau@gmail.com>"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The Developer Certificate of Origin text is the Linux Foundation's,
# distributed verbatim under its own terms.
[[annotations]]
path = "DCO.txt"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"
