name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs this package editable (so coverage collects); the only
      # runtime dependency, `mcp`, resolves from PyPI.
      - name: Install this package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov packaging 'tomli; python_version<"3.11"'

      # The pyproject addopts enforce --cov-branch --cov-fail-under=100, so a
      # coverage regression fails the build here.
      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between runners.
      # This proves the benchmark still runs against the current API
      # rather than rotting into a file that reads as verified and is not.
      - name: Run the benchmark
        run: python benches/bench_gateway.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install ruff black mypy

      - name: Ruff check
        run: ruff check iso20022_mcp/ tests/ benches/

      - name: Black check
        run: black --check iso20022_mcp/ tests/ benches/

      - name: Mypy
        run: mypy iso20022_mcp/
