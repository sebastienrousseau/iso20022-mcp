name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # Installs this package editable (so coverage collects). Its runtime
      # dependency `mcp` and the test toolchain come hash-pinned from
      # requirements/ci.txt; the package itself goes on with --no-deps.
      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      # The pyproject addopts enforce --cov-branch --cov-fail-under=100, so a
      # coverage regression fails the build here.
      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between runners.
      # This proves the benchmark still runs against the current API
      # rather than rotting into a file that reads as verified and is not.
      - name: Run the benchmark
        run: python benches/bench_gateway.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install this package
        run: |
          pip install --require-hashes -r requirements/ci.txt
          pip install --no-deps -e .

      - name: Ruff check
        run: ruff check iso20022_mcp/ tests/ benches/ fuzz/

      - name: Black check
        run: black --check iso20022_mcp/ tests/ benches/ fuzz/

      # Every file carries SPDX copyright and licence lines (REUSE 3.3).
      - name: REUSE licensing check
        run: reuse lint

      - name: Mypy
        run: mypy iso20022_mcp/

      # Per function: cyclomatic <= 10, cognitive <= 15, Halstead
      # difficulty <= 30, <= 60 lines; <= 500 lines per file. The baseline
      # of accepted offenders is empty.
      - name: Complexity
        run: |
          python scripts/check_complexity.py
          complexipy iso20022_mcp scripts benches fuzz examples --max-complexity-allowed 15 --quiet
