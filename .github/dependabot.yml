version: 2
updates:
  # Dependabot resolves a pip job on one Python: for "/" the lowest that
  # pyproject.toml allows (3.10). requirements/build.in is compiled for
  # 3.12, the release toolchain's Python, and floors filelock >= 4.2.1,
  # which needs 3.11: updating it from "/" failed with
  # dependency_file_not_resolvable. "/" leaves it out, and the entry at
  # the end updates it from /requirements, where no pyproject.toml pins
  # the Python and Dependabot uses its newest.
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "requirements/build.in"
      - "requirements/build.txt"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "python"
      # The family servers are optional extras whose floors move together
      # by hand (tests/test_extras_resolve.py asserts the four agree on
      # one xmlschema major); a bump proposed one at a time would put
      # `[all]` back into the unsatisfiable shape that broke 0.0.6.
      - dependency-name: "pain001-mcp"
      - dependency-name: "pacs008-mcp"
      - dependency-name: "camt053-mcp"
      - dependency-name: "acmt001-mcp"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  # The 3.12 release tooling only; every other set stays with "/" above.
  - package-ecosystem: "pip"
    directory: "/requirements"
    exclude-paths:
      - "requirements/ci.*"
      - "requirements/fuzz.*"
      - "requirements/sbom.*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
